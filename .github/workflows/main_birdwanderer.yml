name: Build and deploy Node.js app to Azure Web App - Birdwanderer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install, check, test, and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Prepare production package
        working-directory: frontend
        run: |
          pnpm --filter=bird-wanderer deploy --prod --legacy ../.azure-deploy
          mkdir -p ../.azure-deploy/dist
          cp -R dist/. ../.azure-deploy/dist/

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_23FC02A4D5BC49B383AD9BF4062AC5AA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5756F31A04FA44248BD713538F9BF59D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3152BFE14B445A696F586D3AEE51327 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Birdwanderer
          slot-name: Production
          package: .azure-deploy
